<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<meta name="description" content="Shinobi Blast — turn-based artillery castle siege. Aim, fire, breach the enemy keep. Play free in your browser.">
		<meta property="og:title" content="Shinobi Blast">
		<meta property="og:description" content="Turn-based artillery castle siege — play free in your browser.">
		<meta property="og:image" content="logo.png">
		<title>Shinobi Blast</title>
		<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
body { color: #f3e7c6; background: #0b0a10; overflow: hidden; touch-action: none;
	font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif; }
#canvas { display: block; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center;
	align-items: center; gap: 18px; visibility: hidden;
	background: radial-gradient(ellipse at 50% 35%, #2a1b3d 0%, #0b0a10 65%); }
#status-splash { width: min(60vw, 420px); max-height: 45vh; object-fit: contain;
	filter: drop-shadow(0 8px 24px rgba(0,0,0,.7)); }
#status-progress { display: none; width: min(60vw, 420px); height: 10px; appearance: none; border: 0;
	background: #1f1a2b; border-radius: 6px; overflow: hidden; }
#status-progress::-webkit-progress-bar { background: #1f1a2b; }
#status-progress::-webkit-progress-value { background: linear-gradient(90deg, #d9a441, #f6d77a); }
#status-progress::-moz-progress-bar { background: linear-gradient(90deg, #d9a441, #f6d77a); }
#status-label { display: none; font-size: 14px; letter-spacing: .18em; text-transform: uppercase; opacity: .8; }
#status-notice { display: none; background: #5b3943; border-radius: .5rem; border: 1px solid #9b3943;
	color: #e0e0e0; line-height: 1.3; margin: 0 2rem; overflow: hidden; padding: 1rem; text-align: center; z-index: 1; }
#fs { position: fixed; right: 10px; bottom: 10px; z-index: 2; width: 36px; height: 36px; border-radius: 8px;
	border: 1px solid rgba(246,215,122,.45); background: rgba(11,10,16,.6); color: #f6d77a; font-size: 18px;
	line-height: 34px; text-align: center; cursor: pointer; opacity: .55; display: none; }
#fs:hover { opacity: 1; }
#rotate { display: none; position: fixed; inset: 0; z-index: 3; background: #0b0a10; color: #f3e7c6;
	flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
#rotate .icon { font-size: 64px; }
#rotate b { font-size: 20px; letter-spacing: .08em; text-transform: uppercase; color: #f6d77a; }
#rotate span { opacity: .75; font-size: 14px; max-width: 320px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
		<noscript>Your browser does not support JavaScript.</noscript>
		<div id="status">
			<img id="status-splash" src="logo.png" alt="Shinobi Blast">
			<progress id="status-progress"></progress>
			<div id="status-label">Loading the dojo…</div>
			<div id="status-notice"></div>
		</div>
		<button id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
		<div id="rotate"><div class="icon">🔄</div><b>Rotate your phone</b><span>Shinobi Blast plays in landscape. Turn your device sideways — the game keeps running underneath.</span></div>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":32137136,"index.wasm":35376909},"focusCanvas":true,"gdextensionLibs":[]};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');
	const fsBtn = document.getElementById('fs');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			if (document.fullscreenEnabled) fsBtn.style.display = 'block';
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) setStatusNotice(err.message);
		else if (typeof err === 'string') setStatusNotice(err);
		else setStatusNotice('An unknown error occurred');
		setStatusMode('notice');
		initializing = false;
	}

	fsBtn.addEventListener('click', () => {
		if (document.fullscreenElement) document.exitFullscreen();
		else document.documentElement.requestFullscreen().catch(() => {});
	});

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length !== 0) {
		const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					statusLabel.textContent = 'Loading the dojo… ' + Math.round(100 * current / total) + '%';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => { setStatusMode('hidden'); }, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
